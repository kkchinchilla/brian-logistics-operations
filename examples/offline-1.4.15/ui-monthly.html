const header=['司機','總趟數','值班','跟車','學習','租車','加給／獎勵','懲處','應計薪資'];const body=displayed.map(x=>`<tr><td class="sticky"><button class="rowlink" data-person="${x.d.id}">${esc(x.d.display_name)}</button></td><td>${x.rr.length}</td><td>${x.standby}</td><td>${x.followAlong}</td><td>${x.learning}</td><td>${x.rental}</td><td>${fmt(x.adj.filter(a=>a.category==='allowance').reduce((n,a)=>n+Number(a.amount),0))}</td><td>${fmt(x.adj.filter(a=>a.category!=='allowance').reduce((n,a)=>n+Number(a.amount),0))}</td><td${x.calculated?.salary==null?' class="muted"':''}>${x.calculated?.salary==null?(x.calculated?.knownItemsReady?'待確認':'待設定'):fmt(x.calculated.salary)}</td></tr>`).join('');$('#monthly-body').innerHTML=pendingNote+wrapTable(header,body)+`<p class="note">僅計入「結案」保存的配送紀錄（含有效加趟）；重新開啟後保留上次結案資料，再次「確認結案」後以最新資料取代，不重複計入。租車依結案快照，未知值不算租車。本月已納入 ${closedDates.filter(d=>d.status==='finalized').length} 個結案日期；${closedDates.filter(d=>d.attendance_status==='reopened'||d.status==='reopened').length} 個日期已重新開啟。路線計酬取自「路線管理」目前費率；值班、跟車及學習欄顯示已結案筆數，僅統計出勤，不計算勤務費用；租車費用扣款。點選司機查看各項金額及待確認事項。應計薪資＝配送計酬－租車費用＋加給／獎懲。缺少配送或租車費率，或仍有待確認紀錄時，請點選司機查看原因。</p>`;
 document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>detail(b.dataset.person))}
function detail(id){
 const x=displayed.find(x=>x.d.id===id);if(!x)return;
 const overlay=document.createElement('div');overlay.className='monthly-detail-overlay open';overlay.id='monthly-overlay';overlay.setAttribute('aria-hidden','true');
 const detail=document.createElement('aside');detail.className='monthly-detail open';detail.id='monthly-detail';detail.setAttribute('role','dialog');detail.setAttribute('aria-modal','true');detail.setAttribute('aria-label',x.d.display_name+' 月度薪資明細');
 const adjustments=x.adj.map(a=>`<tr><td>${esc(a.service_date)}</td><td>${a.category==='deduction'?'懲處':a.category==='allowance'?'加給／獎勵':'調整'}</td><td>${esc(a.reason)}</td><td>${fmt(a.amount)}</td><td><button class="rowlink" data-adj="${a.id}">編輯</button></td></tr>`).join('');
 const dutyRows=monthlyDuties.filter(w=>w.driver_id===id).slice().sort((a,b)=>a.service_date.localeCompare(b.service_date)).map(w=>`<tr><td>${esc(w.service_date)}</td><td>${w.kind==='follow_along'?'跟車':'學習'}</td><td>${esc(w.note||'—')}</td><td>${esc(w.id)}</td></tr>`).join('');
 const dayRows=x.rr.slice().sort((a,b)=>a.service_date.localeCompare(b.service_date)).map(r=>{
 return `<tr><td>${esc(r.service_date)}</td><td>${esc(r.route_code_snapshot||'未保存（#'+r.route_id+'）')}</td><td>${r.is_rental===true?'租車':r.is_rental===false?'非租車':'未確認'}</td></tr>`;
}).join('');
detail.innerHTML=`<div class="monthly-detail-header"><div><div class="eyebrow">${esc(month)} / 月度出勤</div><h2>${esc(x.d.display_name)}</h2></div><button class="icon-close" type="button" id="close-detail" aria-label="關閉明細">×</button></div><div class="monthly-detail-body"><div class="drawer-stat-grid"><div class="kpi"><small>配送總趟次</small><strong>${x.rr.length}</strong></div><div class="kpi"><small>值班筆數</small><strong>${x.standby}</strong></div><div class="kpi"><small>租車趟次</small><strong>${x.rental}</strong>${x.unknownRental?`<small>${x.unknownRental} 趟未確認</small>`:''}</div><div class="kpi"><small>薪資調整淨額</small><strong>${fmt(x.adjustment)}</strong></div></div><div class="subtabs drawer-tabs"><button type="button" class="on" id="detail-salary">薪資明細</button><button type="button" id="detail-daily">每日出勤</button></div><section id="detail-salary-panel">${PayrollSettings1491.detailHTML(x.d.id)}<div class="panel-title" style="padding:12px 0">薪資加給與獎懲</div><div class="tools"><button class="btn primary" id="newAdj">＋ 新增加給／獎懲</button></div>${wrapTable(['日期','類型','事由','金額','操作'],adjustments)}<p class="note">懲處以負數入帳。地區或職務相關加給可登記於此；值班、跟車及學習僅保留出勤紀錄。</p></section><section id="detail-daily-panel" hidden><div class="panel-title" style="padding:12px 0">本月已結案配送</div>${wrapTable(['日期','路線編號','租車'],dayRows)}<div class="panel-title" style="padding:12px 0">本月已結案跟車／學習（每筆各計一次）</div>${wrapTable(['日期','勤務','備註','來源'],dutyRows)}<p class="note">僅顯示最近一次確認結案的資料。重新開啟後仍保留此版本；修改後再次確認結案，才會取代報表中的舊資料。</p></section></div>`;
const salary=detail.querySelector('#detail-salary'),daily=detail.querySelector('#detail-daily');
salary.onclick=()=>{salary.classList.add('on');daily.classList.remove('on');detail.querySelector('#detail-salary-panel').hidden=false;detail.querySelector('#detail-daily-panel').hidden=true};
daily.onclick=()=>{daily.classList.add('on');salary.classList.remove('on');detail.querySelector('#detail-daily-panel').hidden=false;detail.querySelector('#detail-salary-panel').hidden=true};

 document.querySelectorAll('#monthly-detail,#monthly-overlay').forEach(el=>el.remove());
 document.body.append(overlay,detail);
 const close=()=>{overlay.remove();detail.remove()};
 overlay.onclick=close;detail.querySelector('#close-detail').onclick=close;
 detail.querySelector('#newAdj').onclick=()=>editAdj(x);
 detail.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>editAdj(x,x.adj.find(a=>a.id==b.dataset.adj)));
}

function editAdj(x,a){const amount=Math.abs(Number(a?.amount||0));const category=a?.category==='deduction'?'deduction':'allowance';modal(a?'編輯薪資調整':'新增薪資加給或獎懲',`<label>類型</label><select class="field" id="adjcat">${option('allowance','薪資加給／獎勵',category)}${option('deduction','懲處（自動扣薪）',category)}</select>${field('日期','adjdate',a?.service_date||last(),'date')}${field('金額（NT$，請輸入正數）','adjamount',amount||'','number')}<div class="note" id="adj-help">選擇懲處時由系統自動扣除，不需要負號。</div>${field('事由','adjreason',a?.reason||'')}`,async()=>{const n=Number(chosen('adjamount'));if(!Number.isSafeInteger(n)||n<=0||n>10000000)throw Error('金額請輸入 1 至 10,000,000 的正整數');if(!chosen('adjreason').trim())throw Error('請填寫原因');if(!chosen('adjdate').startsWith(month))throw Error('請選擇目前報表月份內的日期');const c=chosen('adjcat');const payload={driver_id:x.d.id,service_date:chosen('adjdate'),category:c,amount:c==='deduction'?-n:n,reason:chosen('adjreason').trim(),recorded_by:currentUser.id};await save('payroll_adjustments',payload,a?{id:a.id}:null);await loadMonth();detail(x.d.id)})}
async function exportCSV(){
 const exportMonth=month;if(!await loadMonth()||month!==exportMonth||!monthlyReady)return;
 const zoneColumns=[...new Set(displayed.flatMap(x=>Object.keys(x.z)))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
 const header=['月份','司機','已結案總趟次',...zoneColumns.map(z=>`${z}趟次`),'值班筆數','跟車筆數','學習筆數','租車趟次','租車未確認趟次','薪資加給／獎勵','懲處','加給／獎懲淨額','配送計酬','租車費用（扣款）','應計薪資','待確認事項'];
 const body=displayed.map(x=>[month,x.d.display_name,x.rr.length,...zoneColumns.map(z=>x.z[z]||0),x.standby,x.followAlong,x.learning,x.rental,x.unknownRental,
  x.adj.filter(a=>a.category==='allowance').reduce((n,a)=>n+Number(a.amount),0),
  x.adj.filter(a=>a.category==='deduction').reduce((n,a)=>n+Number(a.amount),0),x.adjustment,x.calculated.variable??'待設定',x.calculated.rentalDeduction??'待設定',x.calculated.salary??(x.calculated.knownItemsReady?'待確認':'待設定'),x.calculated.issues.map(i=>i.message).join('；')]);
 const quote=value=>{const raw=String(value??'');const safe=typeof value==='string'&&/^[\s]*[=+@-]/.test(raw)?"'"+raw:raw;return '"'+safe.replace(/"/g,'""')+'"'};
 const csv=[header,...body].map(row=>row.map(quote).join(',')).join('\r\n');
 const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=u;a.download='月度出勤_'+month+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
</script><script>/* One logout path for desktop and mobile, including the route dashboard. */
(()=>{'use strict';
 let busy=false;
 async function logout(){
  if(busy)return;
  busy=true;
  const buttons=[...document.querySelectorAll('[data-session-logout],#logout,#route-logout')];
  const labels=buttons.map(b=>b.textContent);
  buttons.forEach(b=>{b.disabled=true;b.textContent='登出中…';});
  try{
   const {error}=await db.auth.signOut();
   if(error)throw error;
   location.replace('index.html');
  }catch(e){
   let status=document.getElementById('logout-status');
   if(!status){status=document.createElement('p');status.id='logout-status';status.setAttribute('role','alert');document.querySelector('.main')?.prepend(status);}
   status.textContent='登出失敗，請重試。';
   buttons.forEach((b,i)=>{b.disabled=false;b.textContent=labels[i];});
   busy=false;
  }
 }
 function init(){document.querySelectorAll('[data-session-logout],#logout,#route-logout').forEach(b=>b.addEventListener('click',logout));}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script></body></html>
