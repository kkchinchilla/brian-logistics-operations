<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物流調度 · 登入</title><link rel="stylesheet" href="css/production.css"><style>.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(400px,100%);padding:35px 30px;background:#25282c;border-radius:20px;border:1px solid #414449}.loginbox h1{font-size:27px;margin:0 0 7px}.loginbox p{color:#b0b1b5}.loginbox label{display:block;margin:19px 0 7px}.loginbox input{width:100%}.loginbox button{width:100%;margin-top:20px}.loginbox #error-message{color:#ffda36;font-size:12px;min-height:20px}</style></head><body><main class="login"><section class="loginbox"><h1>物流調度</h1><p>登入以使用每日出勤及管理系統</p><form id="login-form"><label for="email">電子郵件</label><input id="email" type="email" class="field" required autocomplete="username"><label for="password">密碼</label><input id="password" type="password" class="field" required autocomplete="current-password"><button class="btn primary" type="submit">登入</button><p id="error-message" role="alert"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/login.js"></script></body></html>
