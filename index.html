<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貨易通 · 登入</title><link rel="stylesheet" href="css/production.css?v=1422"><style>.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(400px,100%);padding:35px 30px;background:#25282c;border-radius:20px;border:1px solid #414449}.loginbox h1{font-size:27px;margin:0 0 7px}.loginbox p{color:#b0b1b5}.loginbox label{display:block;margin:19px 0 7px}.loginbox input{width:100%}.loginbox .login-help{font-size:12px;margin:8px 0 0;line-height:1.5}.loginbox button{width:100%;margin-top:20px}.loginbox #error-message{color:var(--yellow);font-size:12px;min-height:20px}</style><link rel="icon" type="image/svg+xml" href="assets/tangguanjia-logo.svg?v=1422"><link rel="stylesheet" href="css/brand-1420.css?v=1422"></head><body><main class="login"><section class="loginbox"><h1 class="tgj-login-brand"><img class="tgj-logo" src="assets/tangguanjia-logo.svg?v=1422" width="36" height="36" alt="" aria-hidden="true"><span>貨易通</span></h1><p>登入以使用每日出勤及管理系統</p><form id="login-form"><label for="phone">手機號碼</label><input id="phone" name="phone" type="tel" inputmode="tel" class="field" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="09xxxxxxxx" aria-describedby="phone-help"><p id="phone-help" class="login-help">台灣手機可直接輸入 09 開頭號碼。</p><label for="password">密碼</label><input id="password" type="password" class="field" required autocomplete="current-password"><button id="login-submit" class="btn primary" type="submit">登入</button><p id="error-message" role="alert"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/login.js?v=1428"></script></body></html>
