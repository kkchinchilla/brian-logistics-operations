name: Verify and deploy accepted application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check
      - run: npm test
      - run: node tests/increment_1431/database.mjs
      - run: node tests/increment_1434/monthly-back.mjs
      - run: node tests/increment_1435/report-export.mjs
      - run: node tests/increment_1443/offline-session.mjs
      - run: node tests/increment_1444/android-icon.mjs
      - run: node tests/increment_1445/cold-start.mjs
      - run: node tests/increment_1446/reconnect.mjs
      - run: node tests/increment_1449/android-privacy.mjs
      - run: node tests/increment_1450/android-splash.mjs
      - run: node tests/increment_1451/release-prep.mjs
      - run: node tests/increment_1457/navigation-space.cjs
      - run: npm run test:date-navigation
      - run: node tests/review-account-bootstrap.mjs
      - run: node tests/review-permissions.mjs && node tests/review-access.mjs
      - run: node tests/review-sample.mjs
      - run: node tests/review-ui-entry.mjs
      - run: npm run schema:generate && npm run test:schema
      - run: npm run test:demo
      - uses: actions/upload-artifact@v4
        with:
          name: app-1.4.67
          path: dist/
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run test:ui-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-date-layout-1.4.67
          path: tests/increment_1464/_screenshots/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, layout]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
