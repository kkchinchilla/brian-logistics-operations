<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>司機看板｜配送趟次管理系統</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

    <header class="topbar">

        <div>
            <h1>

                <span id="driver-name">...</span>，你好
            </h1>

            <p>
                今日配送任務
            </p>
        </div>

        <a href="attendance-board.html" class="finance-back">每日出勤總覽</a><a href="ui-attendance.html" class="finance-back">新版 UI 預覽</a>

        <button id="logout-button">
            登出
        </button>

    </header>


    <main class="dashboard driver-dashboard">

        <section class="panel">

            <div class="board-header">

                <h2>我的配送趟次</h2>

                <input type="date" id="driver-date">

            </div>


            <div id="driver-runs">

                <p>
                    載入中...
                </p>

            </div>

        </section>

        <section class="panel" id="driver-special-panel">
            <div class="board-header">
                <h2>我的特殊勤務</h2>
                <button id="driver-special-refresh" type="button" class="finance-small-btn">重新整理</button>
            </div>
            <p class="finance-disclaimer">故障接替、附屬支援與跟車會顯示在此。接替司機回報完成後，主管仍須結束原始趟次並確認實際出勤；不會新增重複配送趟次。</p>
            <p id="driver-special-feedback" role="status" aria-live="polite"></p>
            <div id="driver-special-work"><p>載入中...</p></div>
        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="js/config.js"></script>
    <script src="js/driver.js"></script>

</body>

</html>
